#
# Lens
#  Server network observability
#

# The bind address (0.0.0.0 for all interfaces)
bind-address: "0.0.0.0"

# The bind port (default 9000)
port: 9000

# How long a user needs to stay on to not be a bounce (join then leave)
bounce-threshold: 30

# Players idle for at least this many seconds are counted as afk
afk-threshold: 300
